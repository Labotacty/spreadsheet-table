<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たくらぼ はじプロ配信アーカイブ</title>
<meta name="description" content="たくらぼのはじプロ配信でプレイした、みんなの作ったゲームのデータベース。自分のゲームがいつの配信で遊ばれたか探せます。">
<meta property="og:title" content="たくらぼ はじプロ配信アーカイブ">
<meta property="og:description" content="自分のゲームがいつの配信で遊ばれたか探してみよう！">
<style>
:root{
  --bg:#f6f7fb; --card:#fff; --ink:#1d2433; --sub:#667085; --line:#e4e7ee;
  --main:#e8382f; --main2:#1f8fe0; --accent:#1f78d1; --good:#12b76a;
  --yellow:#ffd60a; --navy:#1d2a5a;
  --radius:14px; --shadow:0 2px 10px rgba(20,30,60,.07);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151c;--card:#1b2029;--ink:#e8ebf2;--sub:#98a2b3;--line:#2b3240;--shadow:0 2px 10px rgba(0,0,0,.3)}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;line-height:1.6}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}

/* header */
header{background:var(--yellow) radial-gradient(rgba(29,42,90,.10) 1.5px,transparent 1.6px) 0 0/16px 16px;color:var(--navy);padding:18px 16px 0;border-bottom:4px solid var(--navy)}
.head-inner{max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:1.35rem;letter-spacing:.02em}
.brand h1 a{color:var(--navy)}
.brand .upd{margin-left:auto;font-size:.75rem;opacity:.75;font-weight:600}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--navy);padding:9px 14px;border-radius:10px 10px 0 0;white-space:nowrap;font-weight:700;font-size:.95rem;opacity:.7}
nav a:hover{text-decoration:none;opacity:1}
nav a.on{background:var(--navy);color:var(--yellow);opacity:1}

main{max-width:1100px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
h2{font-size:1.15rem;margin:26px 0 12px}
h2:first-child{margin-top:4px}
.muted{color:var(--sub);font-size:.85rem}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;text-align:center}
.stat b{display:block;font-size:1.7rem;color:var(--main);line-height:1.2}
.stat span{font-size:.8rem;color:var(--sub)}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}

/* search */
.search{position:relative}
.search input{width:100%;font-size:1.05rem;padding:14px 16px 14px 44px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--main)}
.search::before{content:"🔍";position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:1rem}
.hero{padding:22px 18px;margin-top:14px}
.hero p{margin:0 0 12px;font-weight:600}

/* lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.stream{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;color:inherit;transition:transform .12s}
.stream:hover{transform:translateY(-2px);text-decoration:none}
.thumb{aspect-ratio:16/9;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:var(--navy);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.thumb .num{position:absolute;left:8px;top:8px;background:var(--main);color:#fff;font-size:.95rem;padding:1px 10px;border-radius:8px;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.thumb .badge{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:.75rem;padding:2px 8px;border-radius:6px;font-weight:600}
.stream .body{padding:10px 12px}
.stream .ttl{font-weight:700}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--main);color:#fff;font-weight:700;vertical-align:2px;margin-right:4px}
.tag.sp{background:#9b51e0}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:999px;font-size:.85rem}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}

/* game rows */
.games{display:flex;flex-direction:column;gap:8px}
.game{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.game .no{color:var(--sub);font-size:.8rem;min-width:2.6em;text-align:right}
.game .main{flex:1;min-width:180px}
.game .gname{font-weight:700;word-break:break-all}
.game .by{font-size:.85rem;color:var(--sub)}
.game .side{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.gid{font-family:ui-monospace,Consolas,monospace;font-size:.82rem;border:1px dashed var(--line);border-radius:8px;padding:3px 8px;background:transparent;color:var(--ink);white-space:nowrap}
.gid:hover{border-color:var(--main)}
.gid.copied{border-color:var(--good);color:var(--good)}
.yt{background:#ff0033;color:#fff!important;border-radius:8px;padding:3px 10px;font-size:.8rem;font-weight:700;white-space:nowrap}
.yt:hover{text-decoration:none;opacity:.85}
mark{background:#ffe066;color:inherit;border-radius:3px;padding:0 1px}

/* programmer */
.prow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;color:inherit}
.prow:hover{text-decoration:none;outline:2px solid var(--main)}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0;font-size:1.1rem}
.prow .nm{font-weight:700;word-break:break-all}
.prow .cnt{margin-left:auto;text-align:right;font-weight:800;color:var(--main);white-space:nowrap}
.prow .cnt small{display:block;font-weight:400;color:var(--sub);font-size:.72rem}
.rank{width:2em;text-align:center;font-weight:800;color:var(--sub)}
.rank.r1{color:#f5b400}.rank.r2{color:#9aa4b2}.rank.r3{color:#cd7f32}

.profile{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile .avatar{width:64px;height:64px;font-size:1.6rem}
.profile h2{margin:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.kv div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.kv b{display:block;font-size:1.2rem}
.kv span{font-size:.75rem;color:var(--sub)}
.share{display:inline-flex;align-items:center;gap:6px;background:#000;color:#fff!important;border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:700}
.share:hover{text-decoration:none;opacity:.85}
.btn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--ink);font-size:.85rem}
.btn:hover{border-color:var(--main)}
.btn.primary{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}

/* bars */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:4.5em 1fr 4em;gap:8px;align-items:center;font-size:.85rem}
.bar .track{background:var(--bg);border-radius:6px;height:20px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--main),var(--main2));border-radius:6px}
.bar .v{text-align:right;color:var(--sub)}

.pick{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pick .big{font-size:1.3rem;font-weight:800;word-break:break-all}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.two{grid-template-columns:1fr}}

.more{display:block;margin:16px auto 0}
.empty{text-align:center;color:var(--sub);padding:30px}
.loading{text-align:center;padding:60px;color:var(--sub)}
.spinner{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--main);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.error{background:#fee4e2;color:#b42318;padding:12px;border-radius:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#1d2433;color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;transition:transform .2s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
.back{display:inline-block;margin-bottom:10px;font-size:.9rem}
footer{text-align:center;color:var(--sub);font-size:.8rem;padding:20px}

/* table view */
.tablewrap{overflow-x:auto;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none}
th.on{color:var(--main)}
td.wrap{white-space:normal;min-width:200px}

@media(max-width:640px){
  .brand h1{font-size:1.05rem}
  .brand .upd{font-size:.68rem;width:100%;margin-left:0}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .thumb{font-size:1.4rem}
  .stream .body{padding:8px 10px;font-size:.88rem}
  .kv{grid-template-columns:repeat(3,1fr);gap:6px}
  .kv b{font-size:1rem}
  .kv span{font-size:.68rem}
  .stat b{font-size:1.4rem}
}
</style>
</head>

// ===================== ユーティリティ =====================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 検索用の正規化：全角半角・大小文字・カタカナ/ひらがなの違いを吸収、空白除去
const norm = s => String(s ?? '').normalize('NFKC').toLowerCase()
  .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
  .replace(/\s+/g, '');
const pad = n => String(n).padStart(2, '0');
function jstDate(v){
  const d = new Date(v);
  if (isNaN(d)) return null;
  const j = new Date(d.getTime() + 9*3600e3);
  return `${j.getUTCFullYear()}-${pad(j.getUTCMonth()+1)}-${pad(j.getUTCDate())}`;
}
const fmtDate = k => k ? k.replace(/-/g, '/') : '日付不明';
const WEEK = '日月火水木金土';
const fmtDateW = k => { if(!k) return '日付不明'; const d = new Date(k+'T00:00:00+09:00'); return `${fmtDate(k)}(${WEEK[d.getDay()]})`; };
function hue(str){ let h = 0; for (const c of String(str)) h = (h*31 + c.codePointAt(0)) % 360; return h; }
function avatar(p, cls=''){
  const ch = [...(p.name || '?')][0];
  return `<div class="avatar ${cls}" style="background:hsl(${hue(p.id)},65%,55%)">${esc(ch)}</div>`;
}
function ytId(v){
  if (!v) return null;
  const s = String(v).trim();
  const m = s.match(/(?:v=|youtu\.be\/|live\/|shorts\/|embed\/)([\w-]{11})/);
  if (m) return m[1];
  return /^[\w-]{11}$/.test(s) ? s : null;
}
// 検索語のハイライト（正規化前の文字列上で、大文字小文字無視の素朴な一致のみ）
function hl(text, terms){
  let out = esc(text);
  if (!terms || !terms.length) return out;
  for (const t of terms){
    if (!t) continue;
    const re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    out = out.replace(re, m => `<mark>${m}</mark>`);
  }
  return out;
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); }
  catch { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
}

const DB = { rows: [], streams: [], streamByKey: new Map(), progs: new Map(), updated: '' };

function loadJSONP(){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now();
    const sc = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('タイムアウトしました')); }, 30000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; sc.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    sc.onerror = () => { cleanup(); reject(new Error('データの読み込みに失敗しました')); };
    sc.src = `${WEB_APP_URL}?callback=${cb}&t=${Date.now()}`;
    document.body.appendChild(sc);
  });
}

// 「アーカイブ」タブを読み込む（Google Visualization API の JSONP）。失敗しても null を返すだけ
function loadArchiveTab(){
  return new Promise(resolve => {
    const cb = 'arc_' + Date.now();
    const sc = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); resolve(null); }, 15000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; sc.remove(); }
    window[cb] = res => {
      cleanup();
      try {
        if (res.status !== 'ok') return resolve(null);
        const labels = res.table.cols.map(c => String(c.label || '').trim());
        const iDate = labels.findIndex(l => l.includes('配信日'));
        const iNo = labels.findIndex(l => l.includes('配信No'));
        const iUrl = labels.findIndex(l => /URL|動画/i.test(l));
        const byDate = {}, byNo = {};
        for (const r of res.table.rows){
          const c = r.c || [];
          const id = ytId(c[iUrl]?.v);
          if (!id) continue;
          const dv = c[iDate]?.v;
          let key = null;
          const m = typeof dv === 'string' && dv.match(/Date\((\d+),(\d+),(\d+)/);
          if (m) key = `${m[1]}-${pad(+m[2] + 1)}-${pad(m[3])}`;
          else if (dv){ const t = String(dv).match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/); if (t) key = `${t[1]}-${pad(t[2])}-${pad(t[3])}`; }
          if (key) (byDate[key] ||= []).includes(id) || byDate[key].push(id);
          const no = c[iNo]?.v;
          if (typeof no === 'number') (byNo[no] ||= []).includes(id) || byNo[no].push(id);
        }
        resolve({ byDate, byNo });
      } catch { resolve(null); }
    };
    sc.onerror = () => { cleanup(); resolve(null); };
    sc.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1&sheet=${encodeURIComponent(ARCHIVE_TAB)}&t=${Date.now()}`;
    document.body.appendChild(sc);
  });
}

function build(data, arc){
  const [head, ...body] = data.values;
  const col = name => head.findIndex(h => String(h).trim() === name);
  const C = {
    no: col('No.'), date: col('配信日'), sno: col('配信No.'),
    pid: col('プログラマID'), pname: col('プログラマ名'),
    gid: col('ゲームID'), gname: col('ゲーム名'),
    url: head.findIndex(h => /URL|動画|アーカイブ/i.test(String(h))),
  };
  DB.updated = data.timestamp || '';

  for (const r of body){
    if (!r[C.gname] && !r[C.pname]) continue;
    const dateKey = jstDate(r[C.date]);
    const snoRaw = String(r[C.sno] ?? '').trim();
    const row = {
      no: Number(r[C.no]) || 0,
      date: dateKey,
      sno: snoRaw,
      pid: String(r[C.pid] ?? '').trim(),
      pname: String(r[C.pname] ?? '').trim(),
      gid: String(r[C.gid] ?? '').trim(),
      gname: String(r[C.gname] ?? '').trim(),
      url: C.url >= 0 ? ytId(r[C.url]) : null,
    };
    row.pkey = row.pid || ('name:' + row.pname);
    row.search = norm(row.gname + ' ' + row.pname + ' ' + row.gid + ' ' + row.pid);
    DB.rows.push(row);

    // 配信回
    const skey = (dateKey || '') + '|' + snoRaw;
    let st = DB.streamByKey.get(skey);
    if (!st){
      const num = /^\d+$/.test(snoRaw) ? Number(snoRaw) : null;
      st = { key: skey, date: dateKey, sno: snoRaw, num, special: num === null, games: [], video: null, videos: [] };
      DB.streamByKey.set(skey, st);
      DB.streams.push(st);
    }
    st.games.push(row);
    if (row.url && !st.videos.includes(row.url)) st.videos.push(row.url);
    row.stream = st;

    // プログラマ
    let p = DB.progs.get(row.pkey);
    if (!p){ p = { id: row.pkey, pid: row.pid, names: new Map(), games: [], streams: new Set() }; DB.progs.set(row.pkey, p); }
    p.games.push(row);
    p.streams.add(st);
    p.names.set(row.pname, (p.names.get(row.pname) || 0) + 1);
  }

  DB.streams.sort((a,b) => (a.date||'').localeCompare(b.date||'') || a.games[0].no - b.games[0].no);
  DB.streams.forEach((s, i) => {
    s.idx = i + 1; // 通算何回目か
    // 優先順：シートの動画URL列 → アーカイブタブ（日付一致 → 配信No.一致） → 埋め込みの予備
    if (!s.videos.length && arc) s.videos = (s.date && arc.byDate[s.date]) || (s.num !== null && arc.byNo[s.num]) || [];
    if (!s.videos.length && s.date && ARCHIVES[s.date]) s.videos = [].concat(ARCHIVES[s.date]);
    s.video = s.videos[0] || null;
    s.games.sort((a,b) => a.no - b.no);
  });
  for (const p of DB.progs.values()){
    p.games.sort((a,b) => a.no - b.no);
    p.name = p.games[p.games.length - 1].pname || '(名前なし)'; // 最新の名前
    p.allNames = [...p.names.keys()].filter(Boolean);
    p.first = p.games[0].stream;
    p.last = p.games[p.games.length - 1].stream;
    p.search = norm(p.allNames.join(' ') + ' ' + p.pid);
  }
  DB.progList = [...DB.progs.values()].sort((a,b) => b.games.length - a.games.length || a.first.idx - b.first.idx);
  DB.progList.forEach((p,i) => p.rank = i + 1);
}

// ===================== 部品 =====================
function streamTitle(s){
  if (s.num !== null) return `第${s.num}回`;
  if (!s.sno || s.sno === '採番なし') return s.idx === 1 ? '初回配信' : '特別配信';
  return s.sno;
}
function streamLink(s){ return `#/stream/${encodeURIComponent(s.key)}`; }
function progLink(p){ return `#/p/${encodeURIComponent(p.id)}`; }
function ytBtn(s, label='▶ アーカイブ'){
  return s.video ? `<a class="yt" href="https://www.youtube.com/watch?v=${esc(s.video)}" target="_blank" rel="noopener">${label}</a>` : '';
}
function gidBtn(g){
  return g.gid ? `<button class="gid" data-copy="${esc(g.gid)}" title="クリックでコピー">${esc(g.gid)}</button>` : '';
}
function streamCard(s){
  const img = s.video ? `<img loading="lazy" src="https://i.ytimg.com/vi/${esc(s.video)}/mqdefault.jpg" alt="">` : '';
  const label = s.num !== null ? `#${s.num}` : '★';
  return `<a class="stream" href="${streamLink(s)}">
    <div class="thumb">${label}${img}${img ? `<span class="num">${label}</span>` : ''}<span class="badge">${s.games.length}作品</span></div>
    <div class="body">
      <div class="ttl">${s.special ? '<span class="tag sp">企画</span>' : ''}${esc(streamTitle(s))}</div>
      <div class="muted">${fmtDateW(s.date)}</div>
    </div></a>`;
}
function gameRow(g, {terms, showStream = true, showBy = true} = {}){
  const s = g.stream, p = DB.progs.get(g.pkey);
  return `<div class="game">
    <div class="main">
      <div class="gname">${hl(g.gname || '(タイトルなし)', terms)}</div>
      ${showBy ? `<div class="by">by <a href="${progLink(p)}">${hl(g.pname || '(名前なし)', terms)}</a></div>` : ''}
    </div>
    <div class="side">
      ${showStream ? `<a href="${streamLink(s)}">${esc(streamTitle(s))}・${fmtDate(s.date)}</a>` : ''}
      ${gidBtn(g)}
      ${ytBtn(s, '▶')}
    </div></div>`;
}
function progRow(p, {rank, terms} = {}){
  const r = rank ? `<div class="rank r${rank}">${rank}</div>` : '';
  const others = p.allNames.filter(n => n !== p.name);
  return `<a class="prow" href="${progLink(p)}">${r}${avatar(p)}
    <div><div class="nm">${hl(p.name, terms)}</div>
    <div class="muted">${others.length ? '別名: ' + hl(others.slice(0,3).join(' / '), terms) + (others.length > 3 ? ' 他' : '') + '<br>' : ''}初登場 ${fmtDate(p.first.date)}</div></div>
    <div class="cnt">${p.games.length}<small>作品</small></div></a>`;
}

// ページング付きリスト
function paged(container, items, render, size = 60){
  let n = 0;
  const box = document.createElement('div');
  box.className = container.dataset.cls || '';
  const btn = document.createElement('button');
  btn.className = 'btn more';
  container.append(box, btn);
  function more(){
    box.insertAdjacentHTML('beforeend', items.slice(n, n + size).map(render).join(''));
    n += size;
    btn.style.display = n < items.length ? '' : 'none';
    btn.textContent = `もっと見る（残り ${items.length - n} 件）`;
  }
  btn.onclick = more;
  if (!items.length) box.innerHTML = '<div class="empty">見つかりませんでした</div>';
  more();
}

function parseTerms(q){ return q.split(/[\s　]+/).filter(Boolean); }
function matchAll(text, nterms){ return nterms.every(t => text.includes(t)); }

function homeSearch(q){
  sessionStorage.setItem('q', q);
  const res = $('#res');
  const terms = parseTerms(q), nterms = terms.map(norm);
  if (!terms.length){ res.innerHTML = ''; return; }
  const progs = DB.progList.filter(p => matchAll(p.search, nterms));
  const games = DB.rows.filter(g => matchAll(g.search, nterms));
  res.innerHTML = `<p class="muted" style="margin:12px 0 8px">プログラマ ${progs.length}人 ・ ゲーム ${games.length}件</p>`;
  if (progs.length){
    res.insertAdjacentHTML('beforeend', '<h2 style="margin-top:8px">👤 プログラマ</h2>');
    const c = document.createElement('div'); c.dataset.cls = 'games'; res.appendChild(c);
    paged(c, progs, p => progRow(p, {terms}), 6);
  }
  if (games.length){
    res.insertAdjacentHTML('beforeend', '<h2>🎮 ゲーム</h2>');
    const c = document.createElement('div'); c.dataset.cls = 'games'; res.appendChild(c);
    paged(c, games.slice().reverse(), g => gameRow(g, {terms}), 20);
  }
  if (!progs.length && !games.length) res.insertAdjacentHTML('beforeend', '<div class="empty">見つかりませんでした。表記を変えて試してみてください</div>');
}

function viewStreams(year){
  const years = [...new Set(DB.streams.map(s => s.date?.slice(0,4)).filter(Boolean))].reverse();
  year = year || 'all';
  let list = DB.streams.slice().reverse();
  if (year === 'special') list = list.filter(s => s.special);
  else if (year !== 'all') list = list.filter(s => s.date?.startsWith(year));
  app.innerHTML = `<h2>📺 配信回一覧 <span class="muted">${list.length}回</span></h2>
    <div class="chips">
      <a class="chip ${year==='all'?'on':''}" href="#/streams">すべて</a>
      ${years.map(y => `<a class="chip ${year===y?'on':''}" href="#/streams/${y}">${y}年</a>`).join('')}
      <a class="chip ${year==='special'?'on':''}" href="#/streams/special">★ 企画回</a>
    </div><div id="list"></div>`;
  const c = $('#list'); c.dataset.cls = 'grid';
  paged(c, list, streamCard, 48);
}

function viewStream(key){
  const s = DB.streamByKey.get(key);
  if (!s) return notFound();
  const i = s.idx - 1, prev = DB.streams[i-1], next = DB.streams[i+1];
  const players = new Set(s.games.map(g => g.pkey));
  const firsts = s.games.filter(g => DB.progs.get(g.pkey).first === s).length;
  app.innerHTML = `
    <a class="back" href="#/streams">← 配信回一覧</a>
    <div class="card">
      <div class="two" style="align-items:center">
        <div>
          <div class="muted">通算${s.idx}回目の配信</div>
          <h2 style="margin:2px 0 6px;font-size:1.5rem">${s.special?'<span class="tag sp">企画</span>':''}${esc(streamTitle(s))}</h2>
          <div>${fmtDateW(s.date)}</div>
          <div class="kv">
            <div><b>${s.games.length}</b><span>作品</span></div>
            <div><b>${players.size}</b><span>プログラマ</span></div>
            <div><b>${firsts}</b><span>初登場</span></div>
          </div>
          <p style="display:flex;gap:8px;flex-wrap:wrap">${s.videos.length ? s.videos.map((v, k) => `<a class="yt" href="https://www.youtube.com/watch?v=${esc(v)}" target="_blank" rel="noopener">▶ YouTubeでアーカイブを見る${s.videos.length > 1 ? `（${k+1}本目）` : ''}</a>`).join('') : `<a href="${PLAYLIST_URL}" target="_blank" rel="noopener">📺 再生リストから探す</a>`}</p>
        </div>
        ${s.video ? `<a href="https://www.youtube.com/watch?v=${esc(s.video)}" target="_blank" rel="noopener" class="thumb" style="border-radius:12px"><img src="https://i.ytimg.com/vi/${esc(s.video)}/hqdefault.jpg" alt=""></a>` : ''}
      </div>
    </div>
    <h2>🎮 プレイしたゲーム（プレイ順）</h2>
    <div class="games">${s.games.map((g, k) => gameRow(g, {showStream:false}).replace('<div class="main">', `<div class="no">${k+1}</div><div class="main">`)).join('')}</div>
    <p style="display:flex;justify-content:space-between;margin-top:20px">
      <span>${prev ? `<a href="${streamLink(prev)}">← ${esc(streamTitle(prev))}</a>` : ''}</span>
      <span>${next ? `<a href="${streamLink(next)}">${esc(streamTitle(next))} →</a>` : ''}</span>
    </p>`;
}

function viewProgrammers(){
  app.innerHTML = `<h2>👤 プログラマ一覧 <span class="muted">${DB.progs.size}人</span></h2>
    <div class="search" style="margin-bottom:10px"><input id="pq" type="search" placeholder="名前・プログラマIDで絞り込み（過去の名前でもOK）" autocomplete="off"></div>
    <div class="chips" id="psort">
      <button class="chip on" data-s="count">作品数順</button>
      <button class="chip" data-s="new">新しく参加した順</button>
      <button class="chip" data-s="old">古参順</button>
      <button class="chip" data-s="name">名前順</button>
    </div><div id="list"></div>`;
  let sort = 'count';
  const draw = () => {
    const nterms = parseTerms($('#pq').value).map(norm);
    let list = DB.progList.filter(p => matchAll(p.search, nterms));
    if (sort === 'new') list = list.slice().sort((a,b) => b.first.idx - a.first.idx || b.games[0].no - a.games[0].no);
    if (sort === 'old') list = list.slice().sort((a,b) => a.first.idx - b.first.idx || a.games[0].no - b.games[0].no);
    if (sort === 'name') list = list.slice().sort((a,b) => a.name.localeCompare(b.name, 'ja'));
    const c = $('#list'); c.innerHTML = ''; c.dataset.cls = 'games';
    const terms = parseTerms($('#pq').value);
    paged(c, list, p => progRow(p, {terms}), 50);
  };
  $('#pq').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(draw, 150); });
  $('#psort').onclick = e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    sort = b.dataset.s;
    document.querySelectorAll('#psort .chip').forEach(x => x.classList.toggle('on', x === b));
    draw();
  };
  draw();
}

function viewProgrammer(id){
  const p = DB.progs.get(id);
  if (!p) return notFound();
  const streams = [...p.streams].sort((a,b) => a.idx - b.idx);
  const others = p.allNames.filter(n => n !== p.name);
  const url = location.href;
  const shareText = `たくらぼさんのはじプロ配信で、私（${p.name}）のゲームが${p.games.length}作品プレイされました！🎮`;
  const byYear = {};
  for (const g of p.games){ const y = g.stream.date?.slice(0,4) || '?'; byYear[y] = (byYear[y]||0) + 1; }
  // 投稿の多い順位（作品数が同じ人は同順位）
  const rank = DB.progList.findIndex(x => x.games.length === p.games.length) + 1;
  app.innerHTML = `
    <a class="back" href="#/programmers">← プログラマ一覧</a>
    <div class="card">
      <div class="profile">${avatar(p)}
        <div style="flex:1;min-width:200px">
          <h2>${esc(p.name)}</h2>
          ${p.pid ? `<button class="gid" data-copy="${esc(p.pid)}" title="クリックでコピー">${esc(p.pid)}</button>` : ''}
          ${others.length ? `<div class="muted" style="margin-top:4px">過去の名前: ${esc(others.join(' / '))}</div>` : ''}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <a class="share" target="_blank" rel="noopener" href="https://x.com/intent/post?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(url)}">𝕏 でシェア</a>
          <button class="btn" data-copy="${esc(url)}">🔗 リンクをコピー</button>
        </div>
      </div>
      <div class="kv">
        <div><b>${p.games.length}</b><span>プレイされた作品</span></div>
        <div><b>${streams.length}</b><span>登場した配信</span></div>
        <div><b>${rank}位</b><span>作品数ランキング</span></div>
        <div><b>${fmtDate(p.first.date)}</b><span>初登場（${esc(streamTitle(p.first))}）</span></div>
        <div><b>${fmtDate(p.last.date)}</b><span>最新登場</span></div>
      </div>
    </div>
    ${Object.keys(byYear).length > 1 ? `<h2>📈 年ごとの作品数</h2><div class="card">${barsHTML(Object.entries(byYear).map(([y,v]) => [y+'年', v]))}</div>` : ''}
    <h2>🎮 プレイされた作品（${p.games.length}）</h2>
    <div class="games">${p.games.slice().reverse().map(g => gameRow(g, {showBy:false})).join('')}</div>`;
}

function viewGames(){
  app.innerHTML = `<h2>🗂 ゲーム一覧（表）</h2>
    <div class="search" style="margin-bottom:10px"><input id="gq" type="search" placeholder="ゲーム名・プログラマ名・IDで絞り込み（スペースでAND検索）" autocomplete="off"></div>
    <p class="muted" id="gcount"></p>
    <div class="tablewrap"><table><thead><tr>
      <th data-k="no">No.</th><th data-k="date">配信日</th><th data-k="stream">配信回</th>
      <th data-k="gname">ゲーム名</th><th data-k="pname">プログラマ</th><th>ゲームID</th><th></th>
    </tr></thead><tbody id="tb"></tbody></table></div>
    <button class="btn more" id="gmore"></button>`;
  let sortK = 'no', asc = false, list = [], n = 0;
  const SIZE = 100;
  const keyOf = (g, k) => k === 'stream' ? g.stream.idx : k === 'date' ? (g.date || '') : g[k];
  function rowHTML(g, terms){
    const p = DB.progs.get(g.pkey);
    return `<tr><td>${g.no}</td><td>${fmtDate(g.date)}</td>
      <td><a href="${streamLink(g.stream)}">${esc(streamTitle(g.stream))}</a></td>
      <td class="wrap">${hl(g.gname, terms)}</td>
      <td><a href="${progLink(p)}">${hl(g.pname, terms)}</a></td>
      <td>${gidBtn(g)}</td><td>${ytBtn(g.stream, '▶')}</td></tr>`;
  }
  function draw(){
    const terms = parseTerms($('#gq').value), nterms = terms.map(norm);
    list = DB.rows.filter(g => matchAll(g.search, nterms));
    list.sort((a,b) => {
      const x = keyOf(a, sortK), y = keyOf(b, sortK);
      const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'ja');
      return (asc ? c : -c) || (a.no - b.no);
    });
    document.querySelectorAll('th[data-k]').forEach(th => {
      th.classList.toggle('on', th.dataset.k === sortK);
      th.textContent = th.textContent.replace(/ [▲▼]$/, '') + (th.dataset.k === sortK ? (asc ? ' ▲' : ' ▼') : '');
    });
    $('#gcount').textContent = `${list.length.toLocaleString()} 件`;
    $('#tb').innerHTML = ''; n = 0; more(terms);
  }
  function more(terms = parseTerms($('#gq').value)){
    $('#tb').insertAdjacentHTML('beforeend', list.slice(n, n + SIZE).map(g => rowHTML(g, terms)).join(''));
    n += SIZE;
    const b = $('#gmore'); b.style.display = n < list.length ? '' : 'none';
    b.textContent = `もっと見る（残り ${(list.length - n).toLocaleString()} 件）`;
  }
  $('#gmore').onclick = () => more();
  $('#gq').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(draw, 150); });
  document.querySelector('thead').onclick = e => {
    const th = e.target.closest('th[data-k]'); if (!th) return;
    if (sortK === th.dataset.k) asc = !asc; else { sortK = th.dataset.k; asc = sortK === 'gname' || sortK === 'pname'; }
    draw();
  };
  draw();
}

function barsHTML(entries){
  const max = Math.max(...entries.map(e => e[1]));
  return `<div class="bars">${entries.map(([k,v]) => `<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%"></div></div><span class="v">${v.toLocaleString()}</span></div>`).join('')}</div>`;
}

function viewRanking(){
  const top = DB.progList.slice(0, 20);
  const byStreams = [...DB.progs.values()].sort((a,b) => b.streams.size - a.streams.size).slice(0, 10);
  const yearGames = {}, yearStreams = {}, yearNew = {};
  for (const s of DB.streams){ const y = s.date?.slice(0,4); if (!y) continue; yearGames[y] = (yearGames[y]||0) + s.games.length; yearStreams[y] = (yearStreams[y]||0) + 1; }
  for (const p of DB.progs.values()){ const y = p.first.date?.slice(0,4); if (y) yearNew[y] = (yearNew[y]||0) + 1; }
  const biggest = DB.streams.slice().sort((a,b) => b.games.length - a.games.length).slice(0, 6);
  app.innerHTML = `
    <div class="two">
      <div><h2>🏆 プレイされた作品数ランキング</h2><div class="games">${top.map((p,i) => progRow(p, {rank: i+1})).join('')}</div>
        <a class="btn more" href="#/programmers" style="text-align:center;width:max-content">全員を見る →</a></div>
      <div>
        <h2>📅 登場した配信回数ランキング</h2>
        <div class="games">${byStreams.map((p,i) => progRow(p, {rank: i+1}).replace(/<div class="cnt">\d+<small>作品<\/small>/, `<div class="cnt">${p.streams.size}<small>回</small>`)).join('')}</div>
        <h2>📊 年ごとのプレイ作品数</h2><div class="card">${barsHTML(Object.entries(yearGames).map(([y,v]) => [y+'年', v]))}</div>
        <h2>🌱 年ごとの新しいプログラマ</h2><div class="card">${barsHTML(Object.entries(yearNew).map(([y,v]) => [y+'年', v]))}</div>
        <h2>📺 年ごとの配信回数</h2><div class="card">${barsHTML(Object.entries(yearStreams).map(([y,v]) => [y+'年', v]))}</div>
      </div>
    </div>
    <h2>🔥 作品数が多かった配信</h2>
    <div class="grid">${biggest.map(streamCard).join('')}</div>`;
}

function notFound(){ app.innerHTML = `<div class="empty">ページが見つかりませんでした。<br><a href="#/">ホームへ</a></div>`; }

// ===================== ルーティング =====================
function route(){
  const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  const [r, a] = parts;
  document.querySelectorAll('#nav a').forEach(x => {
    const on = x.dataset.r === (r === 'stream' ? 'streams' : r === 'p' ? 'programmers' : (r || ''));
    x.classList.toggle('on', on);
  });
  if (r === 'streams') viewStreams(a);
  else if (r === 'stream') viewStream(parts.slice(1).join('/'));
  else if (r === 'programmers') viewProgrammers();
  else if (r === 'p') viewProgrammer(parts.slice(1).join('/'));
  else if (r === 'games') viewGames();
  else if (r === 'ranking') viewRanking();
  else viewHome();
  if (!route.first) window.scrollTo(0, 0);
  route.first = false;
}
route.first = true;

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  e.preventDefault();
  await copyText(b.dataset.copy);
  toast(`コピーしました：${b.dataset.copy.length > 30 ? 'リンク' : b.dataset.copy}`);
  b.classList.add('copied'); setTimeout(() => b.classList.remove('copied'), 1200);
});

(async () => {
  try {
    const [data, arc] = await Promise.all([loadJSONP(), loadArchiveTab()]);
    if (!data?.values?.length) throw new Error('データが空です');
    if (!arc) console.warn('アーカイブタブを読み込めなかったため、埋め込みの対応表を使います');
    build(data, arc);
    $('#upd').textContent = `最終更新 ${DB.updated} ・ ${SITE_VERSION}`;
    window.addEventListener('hashchange', route);
    route();
  } catch (err) {
    app.innerHTML = `<div class="error">⚠ ${esc(err.message)}<br>時間をおいて再読み込みしてください。</div>`;
    $('#upd').textContent = 'エラー';
  }
})();
</script>
</body>
