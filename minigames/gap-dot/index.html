<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#11161d">
<title>GAP DOT</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1117;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{position:fixed;inset:0}
#wrap{position:relative;width:100vw;height:100dvh;touch-action:none;user-select:none;background:#11161d}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}
.lbl{font-size:11px;color:#9aa6b2}.num{font-size:28px;font-weight:800}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28)}
#card{width:min(82vw,320px);padding:24px;border:1px solid #2a323c;border-radius:18px;background:rgba(19,24,31,.95);text-align:center}
h1{margin:0 0 10px;font-size:30px;letter-spacing:.1em}
p{color:#c5ccd4;line-height:1.6}
button{width:100%;padding:14px;border:0;border-radius:12px;font-size:17px;font-weight:800;background:#fff;color:#111}
.note{font-size:11px;color:#7e8a96}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="hud">
  <div><div class="lbl">SCORE</div><div class="num" id="score">0</div></div>
  <div style="text-align:right"><div class="lbl">BEST</div><div class="num" id="best">0</div></div>
</div>
<div id="overlay">
  <div id="card">
    <h1>GAP DOT</h1>
    <p>流れてくるゲートの隙間を抜け続けよう。</p>
    <p><b>タップで上昇</b><br>何もしないと下降</p>
    <button id="start">START</button>
    <p class="note">縦画面推奨</p>
  </div>
</div>
</div>

<script>
(function(){
const wrap=document.getElementById('wrap');
const c=document.getElementById('c');
const ctx=c.getContext('2d');
const overlay=document.getElementById('overlay');
const startBtn=document.getElementById('start');
const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');

let W=0,H=0,dpr=1,running=false,last=0,score=0,best=0;
let p,gates=[],spawn=0,speed=170,gap=160;

try{best=+(localStorage.getItem('gapdot_best')||0)}catch(e){}
bestEl.textContent=best;

function resize(){
  W=innerWidth; H=innerHeight; dpr=Math.min(devicePixelRatio||1,2);
  c.width=W*dpr; c.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize); resize();

function reset(){
  score=0; scoreEl.textContent='0';
  p={x:W*.28,y:H*.5,vy:0,r:8};
  gates=[]; spawn=.45; speed=170; gap=Math.max(125,Math.min(175,H*.2));
}
function startGame(e){
  if(e && e.cancelable)e.preventDefault();
  if(running)return;
  reset(); running=true; overlay.style.display='none';
  last=performance.now(); requestAnimationFrame(loop);
}
function flap(e){
  if(e && e.cancelable)e.preventDefault();
  if(!running)return;
  p.vy=-320;
}
function makeGate(){
  const min=120+gap/2,max=H-80-gap/2;
  const cy=min+Math.random()*Math.max(10,max-min);
  gates.push({x:W+30,w:26,cy:cy,passed:false});
}
function collide(g){
  if(p.x+p.r<g.x||p.x-p.r>g.x+g.w)return false;
  return p.y-p.r<g.cy-gap/2 || p.y+p.r>g.cy+gap/2;
}
function gameOver(){
  running=false;
  best=Math.max(best,score); bestEl.textContent=best;
  try{localStorage.setItem('gapdot_best',best)}catch(e){}
  overlay.style.display='flex';
  document.getElementById('card').innerHTML=
   '<div class="lbl">GAME OVER</div><div style="font-size:56px;font-weight:900;margin:6px 0">'+score+
   '</div><p>BEST '+best+'</p><button id="retry">RETRY</button><p class="note">タップで上昇</p>';
  const retry=document.getElementById('retry');
  retry.addEventListener('click',function(e){e.stopPropagation();startGame(e)});
}
function update(dt){
  p.vy+=850*dt; p.y+=p.vy*dt;
  spawn-=dt;
  if(spawn<=0){makeGate(); spawn=Math.max(.86,1.18-score*.008);}
  speed=Math.min(270,170+score*2.3);
  gap=Math.max(115,Math.max(125,Math.min(175,H*.2))-score*.9);
  for(const g of gates){
    g.x-=speed*dt;
    if(!g.passed && g.x+g.w<p.x){g.passed=true;score++;scoreEl.textContent=score}
    if(collide(g))return gameOver();
  }
  gates=gates.filter(g=>g.x+g.w>-40);
  if(p.y-p.r<80||p.y+p.r>H-45)return gameOver();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.035)';
  for(let x=0;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(const g of gates){
    const a=g.cy-gap/2,b=g.cy+gap/2;
    ctx.fillStyle='#36414c'; ctx.fillRect(g.x,0,g.w,a); ctx.fillRect(g.x,b,g.w,H-b);
    ctx.fillStyle='#83909c'; ctx.fillRect(g.x-5,a-5,g.w+10,5); ctx.fillRect(g.x-5,b,g.w+10,5);
  }
  if(p){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
}
function loop(now){
  if(!running){draw();return}
  const dt=Math.min((now-last)/1000,.033); last=now;
  update(dt); draw();
  if(running)requestAnimationFrame(loop);
}

startBtn.addEventListener('click',startGame);
overlay.addEventListener('click',function(e){
  if(e.target===overlay) startGame(e);
});
wrap.addEventListener('pointerdown',function(e){
  if(running)flap(e);
},{passive:false});

reset(); draw();
})();
</script>
</body>
</html>
